version: "3.8"

x-airflow-common: &airflow-common
  # Ganti ke 'build: .' jika ingin install Spark di dalam Airflow
  build:
    context: ./docker/airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./scripts:/opt/airflow/scripts
    - ./plugins:/opt/airflow/plugins
  user: "50000:0"
  networks:
    - spark-net
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # Database & Redis
  postgres:
    image: postgres:13
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    container_name: postgres
    ports:
    - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5
    networks:
      - spark-net

  redis:
    image: redis:7.0
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spark-net

  # Airflow Services
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Admin --lastname User
      --role Admin --email admin@example.com"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-worker:
    <<: *airflow-common
    command: celery worker

  # Spark
  spark-master:
    build:
      context: ./docker/spark
    container_name: spark-master
    # Tambahkan command ini agar menjalankan Master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8081:8080"
      - "10000:10000"
    networks:
      - spark-net

  spark-worker:
    build:
      context: ./docker/spark
    container_name: spark-worker
    # Tambahkan command ini agar menjalankan Worker yang terhubung ke Master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_MODE=worker
    depends_on:
      - spark-master
    networks:
      - spark-net

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - spark-net

  trino:
    image: trinodb/trino:435
    container_name: trino
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    ports:
      - "8088:8080"   # beda dari Airflow 8080
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - trino-data:/data
    depends_on:
      - minio
    networks:
      - spark-net

  metabase:
    image: metabase/metabase:v0.56.4
    container_name: metabase
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    ports:
      - "8082:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=${METABASE_DB_NAME}
      - MB_DB_PORT=5432
      - MB_DB_USER=${DB_USER}
      - MB_DB_PASS=${DB_PASSWORD}
      - MB_DB_HOST=${VPS_IP}
      - JAVA_OPTS=${METABASE_JAVA_OPTS}
    networks:
      - spark-net
    restart: always

networks:
  spark-net:
    driver: bridge

volumes:
  postgres-db-volume:
  minio-data:
  trino-data: